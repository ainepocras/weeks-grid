<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>85 Years in Weeks</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --panel: #ffffff;
            --ink: #1f2937;
            --muted: #64748b;
            --border: #e2e8f0;
            --lived: #3b82f6;
            --unlived: #e2e8f0;
            --shadow: rgba(15, 23, 42, 0.08);
        }

        html, body {
            height: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 18px 20px;
        }

        .app {
            width: min(96vw, 1180px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.2rem, 2vw, 1.8rem);
            text-align: center;
        }

        p.subtitle {
            color: var(--muted);
            margin: 0;
            font-size: 0.8rem;
            text-align: center;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: end;
            gap: 10px;
            width: 100%;
            background: var(--panel);
            border-radius: 8px;
            box-shadow: 0 2px 8px var(--shadow);
            padding: 10px 12px;
            box-sizing: border-box;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.75rem;
            color: var(--muted);
        }

        .field select,
        .field input,
        .controls button {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 10px;
            font: inherit;
            background: #fff;
            color: var(--ink);
        }

        .controls button {
            background: var(--lived);
            color: white;
            border: none;
            cursor: pointer;
            transition: filter 0.15s ease;
            min-width: 92px;
        }

        .controls button:hover {
            filter: brightness(0.96);
        }

        .legend {
            display: flex;
            gap: 16px;
            margin-top: 2px;
            font-size: 0.75rem;
            background: var(--panel);
            padding: 6px 12px;
            border-radius: 6px;
            box-shadow: 0 1px 3px var(--shadow);
            flex-wrap: wrap;
            justify-content: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-box {
            width: 10px;
            height: 10px;
            border-radius: 1px;
        }

        .stats {
            background: var(--panel);
            padding: 5px 12px;
            border-radius: 6px;
            box-shadow: 0 1px 3px var(--shadow);
            margin-top: 2px;
            font-size: 0.75rem;
            text-align: center;
        }

        .grid-container {
            background: var(--panel);
            padding: 10px 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px var(--shadow);
            display: flex;
            justify-content: center;
            align-items: center;
            width: min(96vw, 1100px);
            box-sizing: border-box;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(52, minmax(0, 1fr));
            grid-template-rows: repeat(85, minmax(0, 1fr));
            gap: 2px;
            width: 100%;
            height: min(72vh, 760px);
            min-height: 420px;
        }

        .cell {
            background-color: var(--unlived);
            border-radius: 0.5px;
            cursor: pointer;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
            min-width: 0;
        }

        .cell:hover {
            transform: scale(1.35);
            z-index: 10;
            box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.25);
        }

        .cell.lived {
            background-color: var(--lived) !important;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.35);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 100;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.2);
            text-align: center;
            max-width: 320px;
            width: min(88vw, 320px);
        }

        .modal-card h3 {
            margin: 0 0 8px 0;
            color: #1e293b;
        }

        .modal-card p {
            margin: 0 0 15px 0;
            color: #64748b;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .modal-card button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .modal-card button:hover {
            background: #2563eb;
        }

        @media (max-width: 640px) {
            body {
                padding: 12px 10px;
            }

            .controls {
                gap: 8px;
            }

            .field {
                width: 100%;
            }

            .field select,
            .field input,
            .controls button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <h1 id="mainTitle">85 Years in Weeks</h1>
        <p class="subtitle" id="subtitle">Loading...</p>

        <div class="controls">
            <label class="field" for="languageSelect">
                <span id="languageLabel">Language</span>
                <select id="languageSelect" aria-label="Language selector">
                    <option value="en">English</option>
                    <option value="es">Español</option>
                    <option value="nl">Nederlands</option>
                </select>
            </label>

            <label class="field" for="birthInput">
                <span id="birthLabel">Birthdate</span>
                <input id="birthInput" type="date" aria-label="Birthdate">
            </label>

            <button id="applyBtn" type="button">Apply</button>
        </div>

        <div class="legend" id="legendContainer">
            <div class="legend-item">
                <div class="legend-box" style="background-color: #3b82f6;"></div>
                <span id="legendLived">Lived Weeks</span>
            </div>
            <div class="legend-item">
                <div class="legend-box" style="background-color: #e2e8f0;"></div>
                <span id="legendUnlived">Unlived Weeks</span>
            </div>
        </div>

        <div class="stats" id="stats">
            <span id="statsLabel">Lived:</span> <span id="count">0</span> / 4,420 weeks (<span id="percentage">0</span>%)
        </div>

        <div class="grid-container">
            <div class="grid" id="grid" aria-live="polite"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <h3 id="modalTitle">Week 1</h3>
            <p id="modalText">Details here</p>
            <button id="modalClose" type="button">Close</button>
        </div>
    </div>

    <script>
        const i18n = {
            en: {
                title: "85 Years in Weeks",
                subtitle: "Week 1 starts on your birthdate: ",
                legendLived: "Lived Weeks",
                legendUnlived: "Unlived Weeks",
                statsLived: "Lived:",
                languageLabel: "Language",
                birthLabel: "Birthdate",
                applyBtn: "Apply",
                closeBtn: "Close",
                weekPrefix: "Week ",
                statusLived: "Lived",
                statusUnlived: "Unlived"
            },
            es: {
                title: "85 Años en Semanas",
                subtitle: "La semana 1 comienza en tu fecha de nacimiento: ",
                legendLived: "Semanas vividas",
                legendUnlived: "Semanas por vivir",
                statsLived: "Vividas:",
                languageLabel: "Idioma",
                birthLabel: "Fecha de nacimiento",
                applyBtn: "Aplicar",
                closeBtn: "Cerrar",
                weekPrefix: "Semana ",
                statusLived: "Vivida",
                statusUnlived: "Por vivir"
            },
            nl: {
                title: "85 Jaar in Weken",
                subtitle: "Week 1 begint op je geboortedatum: ",
                legendLived: "Geleefde weken",
                legendUnlived: "Nog te leven weken",
                statsLived: "Geleefd:",
                languageLabel: "Taal",
                birthLabel: "Geboortedatum",
                applyBtn: "Toepassen",
                closeBtn: "Sluiten",
                weekPrefix: "Week ",
                statusLived: "Geleefd",
                statusUnlived: "Nog niet geleefd"
            }
        };

        const STORAGE_KEY_LANG = "weeks-grid-language";
        const STORAGE_KEY_BIRTH = "weeks-grid-birthdate";
        const totalWeeks = 85 * 52;

        const gridEl = document.getElementById("grid");
        const countEl = document.getElementById("count");
        const percentageEl = document.getElementById("percentage");
        const subtitleEl = document.getElementById("subtitle");
        const languageSelect = document.getElementById("languageSelect");
        const birthInput = document.getElementById("birthInput");
        const applyBtn = document.getElementById("applyBtn");
        const modalOverlay = document.getElementById("modalOverlay");
        const modalTitle = document.getElementById("modalTitle");
        const modalText = document.getElementById("modalText");
        const modalClose = document.getElementById("modalClose");

        function parseLocalDate(dateString) {
            const defaultDate = new Date(1990, 0, 1);
            if (!/^\d{4}-\d{2}-\d{2}$/.test(dateString)) {
                return defaultDate;
            }

            const [year, month, day] = dateString.split('-').map(Number);
            const date = new Date(year, month - 1, day);

            if (
                Number.isNaN(date.getTime()) ||
                date.getFullYear() !== year ||
                date.getMonth() !== month - 1 ||
                date.getDate() !== day
            ) {
                return defaultDate;
            }

            return date;
        }

        function formatLocalDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");
            return `${year}-${month}-${day}`;
        }

        function getStoredLanguage() {
            const saved = localStorage.getItem(STORAGE_KEY_LANG);
            return i18n[saved] ? saved : "en";
        }

        function getStoredBirth() {
            const saved = localStorage.getItem(STORAGE_KEY_BIRTH);
            if (!saved) return formatLocalDate(new Date(1990, 0, 1));
            const parsed = parseLocalDate(saved);
            return formatLocalDate(parsed);
        }

        function setLanguage(lang) {
            const t = i18n[lang] || i18n.en;
            document.documentElement.lang = lang;
            document.getElementById("mainTitle").textContent = t.title;
            document.getElementById("legendLived").textContent = t.legendLived;
            document.getElementById("legendUnlived").textContent = t.legendUnlived;
            document.getElementById("statsLabel").textContent = t.statsLived;
            document.getElementById("languageLabel").textContent = t.languageLabel;
            document.getElementById("birthLabel").textContent = t.birthLabel;
            document.getElementById("applyBtn").textContent = t.applyBtn;
            document.getElementById("modalClose").textContent = t.closeBtn;
            document.title = t.title;
            languageSelect.value = lang;
        }

        function formatDate(date, lang) {
            const localeMap = { en: "en-US", es: "es-ES", nl: "nl-NL" };
            return date.toLocaleDateString(localeMap[lang] || "en-US", {
                month: "short",
                day: "numeric",
                year: "numeric"
            });
        }

        function addDays(date, days) {
            const result = new Date(date);
            result.setDate(result.getDate() + days);
            return result;
        }

        function clamp(value, min, max) {
            return Math.min(Math.max(value, min), max);
        }

        function getBirthDateFromInput() {
            const value = birthInput.value;
            return parseLocalDate(value);
        }

        function renderGrid(birthDate, lang) {
            const today = new Date();
            const diffInMs = today - birthDate;
            const diffInDays = Math.floor(diffInMs / (1000 * 60 * 60 * 24));
            let livedWeeksCount = Math.floor(diffInDays / 7);
            livedWeeksCount = clamp(livedWeeksCount, 0, totalWeeks);

            gridEl.innerHTML = "";

            for (let i = 0; i < totalWeeks; i++) {
                const cell = document.createElement("div");
                cell.classList.add("cell");

                if (i < livedWeeksCount) {
                    cell.classList.add("lived");
                }

                const weekNum = i + 1;
                const weekStart = addDays(birthDate, i * 7);
                const weekEnd = addDays(weekStart, 6);
                const isLived = i < livedWeeksCount;

                cell.addEventListener("click", () => {
                    const t = i18n[lang] || i18n.en;
                    modalTitle.textContent = t.weekPrefix + weekNum;
                    modalText.innerHTML = `${formatDate(weekStart, lang)} – ${formatDate(weekEnd, lang)}<br><br><strong>Status:</strong> ${isLived ? t.statusLived : t.statusUnlived}`;
                    modalOverlay.classList.add("active");
                    modalOverlay.setAttribute("aria-hidden", "false");
                });

                gridEl.appendChild(cell);
            }

            countEl.textContent = livedWeeksCount;
            percentageEl.textContent = ((livedWeeksCount / totalWeeks) * 100).toFixed(1);
            subtitleEl.textContent = (i18n[lang] || i18n.en).subtitle + formatDate(birthDate, lang);
        }

        function updateSite() {
            const lang = languageSelect.value || getStoredLanguage();
            const birthDate = getBirthDateFromInput();
            const birthDateString = formatLocalDate(birthDate);

            localStorage.setItem(STORAGE_KEY_LANG, lang);
            localStorage.setItem(STORAGE_KEY_BIRTH, birthDateString);

            setLanguage(lang);
            birthInput.value = birthDateString;
            renderGrid(birthDate, lang);
        }

        languageSelect.addEventListener("change", updateSite);
        birthInput.addEventListener("change", updateSite);
        applyBtn.addEventListener("click", updateSite);

        modalClose.addEventListener("click", () => {
            modalOverlay.classList.remove("active");
            modalOverlay.setAttribute("aria-hidden", "true");
        });

        modalOverlay.addEventListener("click", (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove("active");
                modalOverlay.setAttribute("aria-hidden", "true");
            }
        });

        const initialLang = getStoredLanguage();
        const initialBirth = getStoredBirth();
        languageSelect.value = initialLang;
        birthInput.value = initialBirth;
        setLanguage(initialLang);
        renderGrid(parseLocalDate(initialBirth), initialLang);
    </script>
</body>
</html>
