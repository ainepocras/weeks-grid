<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>85 Years in Weeks</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --bg-accent: #eef6ff;
            --panel: #ffffff;
            --ink: #1f2937;
            --muted: #64748b;
            --border: #e2e8f0;
            --lived-blue: #016630;
            --lived-young: #1F7A55;
            --lived-green: #63b76b;
            --young: #add8e6;
            --older: #d7f5d0;
            --shadow: rgba(15, 23, 42, 0.08);
        }

        html, body {
            height: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, var(--bg-accent) 0%, var(--bg) 26%, var(--bg) 100%);
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 18px 20px;
        }

        .app {
            width: min(96vw, 1180px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.2rem, 2vw, 1.8rem);
            text-align: center;
        }

        p.subtitle {
            color: var(--muted);
            margin: 0;
            font-size: 0.8rem;
            text-align: center;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: end;
            gap: 10px;
            width: 100%;
            background: var(--panel);
            border-radius: 8px;
            box-shadow: 0 2px 8px var(--shadow);
            padding: 10px 12px;
            box-sizing: border-box;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.75rem;
            color: var(--muted);
        }

        .field select,
        .field input,
        .controls button {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 10px;
            font: inherit;
            background: #fff;
            color: var(--ink);
        }

        .field select:focus,
        .field input:focus,
        .controls button:focus,
        .modal-card button:focus {
            outline: 2px solid rgba(59, 130, 246, 0.3);
            outline-offset: 2px;
        }

        .controls button {
            background: var(--lived-blue);
            color: white;
            border: none;
            cursor: pointer;
            transition: filter 0.15s ease, transform 0.12s ease;
            min-width: 92px;
        }

        .controls button:hover {
            filter: brightness(0.96);
            transform: translateY(-1px);
        }

        .legend {
            display: flex;
            gap: 16px;
            margin-top: 2px;
            font-size: 0.75rem;
            background: var(--panel);
            padding: 6px 12px;
            border-radius: 6px;
            box-shadow: 0 1px 3px var(--shadow);
            flex-wrap: wrap;
            justify-content: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-box {
            width: 10px;
            height: 10px;
            border-radius: 1px;
        }

        .stats {
            background: var(--panel);
            padding: 5px 12px;
            border-radius: 6px;
            box-shadow: 0 1px 3px var(--shadow);
            margin-top: 2px;
            font-size: 0.75rem;
            text-align: center;
        }

        .grid-container {
            background: var(--panel);
            padding: 10px 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px var(--shadow);
            display: flex;
            justify-content: center;
            align-items: center;
            width: min(96vw, 1100px);
            box-sizing: border-box;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(52, minmax(0, 1fr));
            grid-template-rows: repeat(85, minmax(0, 1fr));
            gap: 2px;
            width: 100%;
            height: min(72vh, 760px);
            min-height: 420px;
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 4px;
            padding: 2px;
            background: rgba(148, 163, 184, 0.08);
        }

        .cell {
            background-color: var(--older);
            border-radius: 0.5px;
            cursor: pointer;
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
            min-width: 0;
            border: 1px solid rgba(148, 163, 184, 0.08);
        }

        .cell.young {
            background-color: var(--lived-blue);
        }

        .cell.older {
            background-color: var(--older);
        }

        .cell:hover {
            transform: scale(1.35);
            z-index: 10;
            box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.25);
            filter: saturate(1.08);
        }

        .cell.lived {
            background-color: var(--lived-blue) !important;
        }

        .cell.lived.young {
            background-color: var(--lived-young) !important;
        }

        .cell.lived.older {
            background-color: var(--lived-green) !important;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.35);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 100;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.2);
            text-align: center;
            max-width: 320px;
            width: min(88vw, 320px);
        }

        .modal-card h3 {
            margin: 0 0 8px 0;
            color: #1e293b;
        }

        .modal-card p {
            margin: 0 0 15px 0;
            color: #64748b;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .modal-card button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .modal-card button:hover {
            background: #2563eb;
        }

        @media (max-width: 640px) {
            body {
                padding: 12px 10px;
            }

            .controls {
                gap: 8px;
            }

            .field {
                width: 100%;
            }

            .field select,
            .field input,
            .controls button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <h1 id="mainTitle">85 Years in Weeks</h1>
        <p class="subtitle" id="subtitle">Loading...</p>

        <div class="controls">
            <label class="field" for="languageSelect">
                <span id="languageLabel">Language</span>
                <select id="languageSelect" aria-label="Language selector">
                    <option value="en">English</option>
                    <option value="es">Español</option>
                    <option value="nl">Nederlands</option>
                </select>
            </label>

            <label class="field" for="birthInput">
                <span id="birthLabel">Birthdate (DD-MM-YYYY)</span>
                <input id="birthInput" type="text" inputmode="numeric" placeholder="DD-MM-YYYY" pattern="[0-9]{2}-[0-9]{2}-[0-9]{4}" maxlength="10" aria-label="Birthdate, day-month-year" title="Enter your birthdate as DD-MM-YYYY" required>
            </label>

            <button id="applyBtn" type="button">Apply</button>
        </div>

        <div class="legend" id="legendContainer">
            <div class="legend-item">
                <div class="legend-box" style="background-color: #1F7A55;"></div>
                <span id="legendLivedYoung">Weeks Lived (0-18)</span>
            </div>
            <div class="legend-item">
                <div class="legend-box" style="background-color: #63b76b;"></div>
                <span id="legendLivedAdult">Weeks Lived (18-today)</span>
            </div>
            <div class="legend-item">
                <div class="legend-box" style="background-color: #d7f5d0;"></div>
                <span id="legendUnlived">Weeks to Live</span>
            </div>
        </div>

        <div class="stats" id="stats">
            <span id="statsLabel">Lived:</span> <span id="count">0</span> / 4,420 weeks (<span id="percentage">0</span>%) <span id="ageInfo">• Age: 0 years</span>
        </div>

        <div class="grid-container">
            <div class="grid" id="grid" aria-live="polite"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <h3 id="modalTitle">Week 1</h3>
            <p id="modalText">Details here</p>
            <button id="modalClose" type="button">Close</button>
        </div>
    </div>

    <script>
        const i18n = {
            en: {
                title: "85 Years in Weeks",
                subtitle: "Week 1 starts on your birthdate: ",
                legendLivedYoung: "Weeks Lived (0-18)",
                legendLivedAdult: "Weeks Lived (18-today)",
                legendUnlived: "Weeks to Live",
                statsLived: "Lived:",
                languageLabel: "Language",
                birthLabel: "Birthdate (DD-MM-YYYY)",
                applyBtn: "Apply",
                closeBtn: "Close",
                weekPrefix: "Week ",
                statusLived: "Lived",
                statusUnlived: "Unlived",
                ageLabel: "Age:",
                invalidDate: "Enter a valid date as DD-MM-YYYY."
            },
            es: {
                title: "85 Años en Semanas",
                subtitle: "La semana 1 comienza en tu fecha de nacimiento: ",
                legendLivedYoung: "Semanas vividas (0-18)",
                legendLivedAdult: "Semanas vividas (18-hoy)",
                legendUnlived: "Semanas por vivir",
                statsLived: "Vividas:",
                languageLabel: "Idioma",
                birthLabel: "Fecha de nacimiento (DD-MM-AAAA)",
                applyBtn: "Aplicar",
                closeBtn: "Cerrar",
                weekPrefix: "Semana ",
                statusLived: "Vivida",
                statusUnlived: "Por vivir",
                ageLabel: "Edad:",
                invalidDate: "Introduce una fecha válida como DD-MM-AAAA."
            },
            nl: {
                title: "85 Jaar in Weken",
                subtitle: "Week 1 begint op je geboortedatum: ",
                legendLivedYoung: "Geleefde weken (0-18)",
                legendLivedAdult: "Geleefde weken (18-heden)",
                legendUnlived: "Nog te leven weken",
                statsLived: "Geleefd:",
                languageLabel: "Taal",
                birthLabel: "Geboortedatum (DD-MM-JJJJ)",
                applyBtn: "Toepassen",
                closeBtn: "Sluiten",
                weekPrefix: "Week ",
                statusLived: "Geleefd",
                statusUnlived: "Nog niet geleefd",
                ageLabel: "Leeftijd:",
                invalidDate: "Voer een geldige datum in als DD-MM-JJJJ."
            }
        };

        const STORAGE_KEY_LANG = "weeks-grid-language";
        const STORAGE_KEY_BIRTH = "weeks-grid-birthdate";
        const totalWeeks = 85 * 52;
        const youthWeeks = 18 * 52;

        const gridEl = document.getElementById("grid");
        const countEl = document.getElementById("count");
        const percentageEl = document.getElementById("percentage");
        const ageInfoEl = document.getElementById("ageInfo");
        const subtitleEl = document.getElementById("subtitle");
        const languageSelect = document.getElementById("languageSelect");
        const birthInput = document.getElementById("birthInput");
        const applyBtn = document.getElementById("applyBtn");
        const modalOverlay = document.getElementById("modalOverlay");
        const modalTitle = document.getElementById("modalTitle");
        const modalText = document.getElementById("modalText");
        const modalClose = document.getElementById("modalClose");

        function parseLocalDate(dateString) {
            if (typeof dateString !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(dateString)) {
                return null;
            }

            const [year, month, day] = dateString.split("-").map(Number);
            const date = new Date(year, month - 1, day);
            if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) {
                return null;
            }

            return date;
        }

        function parseEuropeanDate(dateString) {
            const match = /^(\d{2})-(\d{2})-(\d{4})$/.exec(dateString.trim());
            if (!match) return null;

            const [, day, month, year] = match;
            return parseLocalDate(`${year}-${month}-${day}`);
        }

        function formatLocalDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");
            return `${year}-${month}-${day}`;
        }

        function formatEuropeanDate(date) {
            const day = String(date.getDate()).padStart(2, "0");
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const year = date.getFullYear();
            return `${day}-${month}-${year}`;
        }

        function getStoredLanguage() {
            const saved = localStorage.getItem(STORAGE_KEY_LANG);
            return i18n[saved] ? saved : "en";
        }

        function getStoredBirth() {
            const saved = localStorage.getItem(STORAGE_KEY_BIRTH);
            return parseLocalDate(saved) || new Date(1990, 0, 1);
        }

        function setLanguage(lang) {
            const t = i18n[lang] || i18n.en;
            document.documentElement.lang = lang;
            document.getElementById("mainTitle").textContent = t.title;
            document.getElementById("legendLivedYoung").textContent = t.legendLivedYoung;
            document.getElementById("legendLivedAdult").textContent = t.legendLivedAdult;
            document.getElementById("legendUnlived").textContent = t.legendUnlived;
            document.getElementById("statsLabel").textContent = t.statsLived;
            document.getElementById("languageLabel").textContent = t.languageLabel;
            document.getElementById("birthLabel").textContent = t.birthLabel;
            document.getElementById("applyBtn").textContent = t.applyBtn;
            document.getElementById("modalClose").textContent = t.closeBtn;
            document.title = t.title;
            languageSelect.value = lang;
            birthInput.title = t.invalidDate;
        }

        function formatDate(date, lang) {
            const localeMap = { en: "en-GB", es: "es-ES", nl: "nl-NL" };
            return date.toLocaleDateString(localeMap[lang] || "en-GB", {
                month: "short",
                day: "numeric",
                year: "numeric"
            });
        }

        function addDays(date, days) {
            const result = new Date(date);
            result.setDate(result.getDate() + days);
            return result;
        }

        function clamp(value, min, max) {
            return Math.min(Math.max(value, min), max);
        }

        function getAgeYears(birthDate) {
            const now = new Date();
            let years = now.getFullYear() - birthDate.getFullYear();
            const hasNotHadBirthday = now.getMonth() < birthDate.getMonth() ||
                (now.getMonth() === birthDate.getMonth() && now.getDate() < birthDate.getDate());
            if (hasNotHadBirthday) years -= 1;
            return Math.max(years, 0);
        }

        function renderGrid(birthDate, lang) {
            const today = new Date();
            const diffInDays = Math.floor((today - birthDate) / (1000 * 60 * 60 * 24));
            const livedWeeksCount = clamp(Math.floor(diffInDays / 7), 0, totalWeeks);
            const t = i18n[lang] || i18n.en;
            const ageYears = getAgeYears(birthDate);
            ageInfoEl.textContent = `• ${t.ageLabel} ${ageYears} ${ageYears === 1 ? "year" : "years"}`;

            gridEl.innerHTML = "";

            for (let i = 0; i < totalWeeks; i++) {
                const cell = document.createElement("div");
                cell.classList.add("cell", i < youthWeeks ? "young" : "older");
                const isLived = i < livedWeeksCount;
                if (isLived) cell.classList.add("lived");

                const weekNum = i + 1;
                const weekStart = addDays(birthDate, i * 7);
                const weekEnd = addDays(weekStart, 6);
                const status = isLived ? t.statusLived : t.statusUnlived;
                const label = `${t.weekPrefix}${weekNum} — ${formatDate(weekStart, lang)} to ${formatDate(weekEnd, lang)} (${status})`;
                cell.setAttribute("title", label);
                cell.setAttribute("aria-label", label);

                cell.addEventListener("click", () => {
                    modalTitle.textContent = t.weekPrefix + weekNum;
                    modalText.innerHTML = `${formatDate(weekStart, lang)} – ${formatDate(weekEnd, lang)}<br><br><strong>Status:</strong> ${status}`;
                    modalOverlay.classList.add("active");
                    modalOverlay.setAttribute("aria-hidden", "false");
                });

                gridEl.appendChild(cell);
            }

            countEl.textContent = livedWeeksCount;
            percentageEl.textContent = ((livedWeeksCount / totalWeeks) * 100).toFixed(1);
            subtitleEl.textContent = t.subtitle + formatDate(birthDate, lang);
        }

        function updateSite() {
            const lang = languageSelect.value || getStoredLanguage();
            const birthDate = parseEuropeanDate(birthInput.value);
            const t = i18n[lang] || i18n.en;

            if (!birthDate) {
                birthInput.setCustomValidity(t.invalidDate);
                birthInput.reportValidity();
                return;
            }

            birthInput.setCustomValidity("");
            localStorage.setItem(STORAGE_KEY_LANG, lang);
            localStorage.setItem(STORAGE_KEY_BIRTH, formatLocalDate(birthDate));
            setLanguage(lang);
            renderGrid(birthDate, lang);
        }

        birthInput.addEventListener("input", () => birthInput.setCustomValidity(""));
        languageSelect.addEventListener("change", updateSite);
        birthInput.addEventListener("change", updateSite);
        applyBtn.addEventListener("click", updateSite);

        modalClose.addEventListener("click", () => {
            modalOverlay.classList.remove("active");
            modalOverlay.setAttribute("aria-hidden", "true");
        });

        modalOverlay.addEventListener("click", (event) => {
            if (event.target === modalOverlay) {
                modalOverlay.classList.remove("active");
                modalOverlay.setAttribute("aria-hidden", "true");
            }
        });

        const initialLang = getStoredLanguage();
        const initialBirth = getStoredBirth();
        languageSelect.value = initialLang;
        birthInput.value = formatEuropeanDate(initialBirth);
        setLanguage(initialLang);
        renderGrid(initialBirth, initialLang);
    </script>
</body>
</html>
